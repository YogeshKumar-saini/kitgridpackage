name: Publish Kitgrid Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target'
        required: true
        default: 'npm'
        type: choice
        options:
          - npm
          - github-packages

jobs:
  publish-npm:
    name: Publish to npm
    if: github.event_name == 'release' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: |
          npm run typecheck
          npm run build

      - name: Run Tests
        run: npm test

      - name: Publish to npm
        run: |
          cd packages/kitgrid
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Publish to GitHub Packages
    if: inputs.target == 'github-packages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: |
          npm run typecheck
          npm run build

      - name: Run Tests
        run: npm test

      - name: Publish to GitHub Packages
        run: |
          cd packages/kitgrid
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

